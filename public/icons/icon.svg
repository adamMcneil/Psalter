<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A0000"/>
      <stop offset="1" stop-color="#8B0000"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5D27A"/>
      <stop offset="1" stop-color="#C89B3C"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="40" y="40" width="944" height="944" rx="180" fill="url(#bg)"/>

  <!-- Star of David (both triangles centered at 512,512, side 520) -->
  <g filter="url(#shadow)">
    <polygon
      points="512,212 772,662 252,662"
      fill="none"
      stroke="url(#gold)"
      stroke-width="34"
      stroke-linejoin="round"
    />

    <polygon
      points="512,812 772,362 252,362"
      fill="none"
      stroke="url(#gold)"
      stroke-width="34"
      stroke-linejoin="round"
    />
  </g>

  <!-- Harp Symbol -->
  <g transform="translate(512 515) scale(1.1)" filter="url(#shadow)">
    <path
      d="M-58 -70
         C-95 -40 -95 45 -30 88
         L30 88
         C95 45 95 -40 58 -70
         C44 -45 38 -12 38 28
         L38 88
         L-38 88
         L-38 28
         C-38 -12 -44 -45 -58 -70Z"
      fill="none"
      stroke="url(#gold)"
      stroke-width="18"
      stroke-linejoin="round"
    />

    <line x1="-18" y1="-28" x2="-18" y2="74" stroke="url(#gold)" stroke-width="7"/>
    <line x1="0" y1="-35" x2="0" y2="78" stroke="url(#gold)" stroke-width="7"/>
    <line x1="18" y1="-28" x2="18" y2="74" stroke="url(#gold)" stroke-width="7"/>
  </g>

  <!-- App Name -->
  <text
    x="512"
    y="905"
    text-anchor="middle"
    fill="url(#gold)"
    font-size="88"
    font-family="Georgia, serif"
    letter-spacing="10"
  >
    PSALTER
  </text>
</svg>
